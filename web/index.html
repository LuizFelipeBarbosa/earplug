<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Live music in the Bay Area. Find upcoming gigs, RSVP, follow bands, and browse venues on a map.">
  <meta name="theme-color" content="#0A0A0C">
  <meta name="color-scheme" content="dark light">

  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://clerk.earplug.dev">
  <link rel="preconnect" href="https://decisive-iguana-759.convex.cloud">
  <link rel="preconnect" href="https://tiles.stadiamaps.com">
  <link rel="dns-prefetch" href="https://premium-sheep-24.clerk.accounts.dev">
  <link rel="dns-prefetch" href="https://brilliant-cardinal-773.convex.cloud">

  <link rel="preconnect" href="https://clerk.earplug.app">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EarPlug">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=earplug-logo">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png?v=earplug-logo"/>

  <title>EarPlug — Bay Area live music</title>
  <link rel="manifest" href="manifest.json?v=earplug-logo">

  <style>
    #ep-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0A0A0C;
      color: #F4F4F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.14em;
    }

    #ep-splash-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(244, 244, 240, 0.25);
      border-top-color: #7B8FFF;
      border-radius: 50%;
      animation: ep-spin 0.8s linear infinite;
    }

    @keyframes ep-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body style="background:#0A0A0C;margin:0">
  <div id="ep-splash">
    <div>EARPLUG</div>
    <div id="ep-splash-spinner"></div>
  </div>
  <div id="clerk-captcha"></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
