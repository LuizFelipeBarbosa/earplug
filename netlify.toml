[build]
  publish = "build/web"
  # Netlify's build image has no Flutter SDK, so fetch it first. The version is
  # pinned to match local development; bump it deliberately rather than tracking
  # whatever "stable" happens to be on the day of a build.
  command = """
    set -e
    if [ ! -d "$HOME/flutter" ]; then
      git clone https://github.com/flutter/flutter.git --depth 1 -b 3.44.6 "$HOME/flutter"
    fi
    export PATH="$HOME/flutter/bin:$PATH"
    flutter --version
    if [ "${EARPLUG_ENV:-dev}" = "prod" ]; then
      if [ -n "${CONVEX_DEPLOY_KEY:-}" ]; then
        npx convex deploy --typecheck enable
        npm run check:release-contract -- prod
      else
        echo "CONVEX_DEPLOY_KEY is not configured; using the pre-deployed production backend"
      fi
    fi
    flutter build web --release \
      --dart-define-from-file="config/${EARPLUG_ENV:-dev}.json" \
      --dart-define=STADIA_MAPS_API_KEY="${STADIA_MAPS_API_KEY:-}"
  """

[build.environment]
  # Which config/*.json the web client reads — the Convex URL and Clerk key
  # travel together inside that file because they are chosen together, never
  # independently
  # (docs/environments.md). Preview and branch builds use development by
  # default; the production deploy context below overrides this value.
  EARPLUG_ENV = "dev"

  # When a production Convex deploy key is configured in Netlify, production
  # builds deploy and verify the backend before publishing. Without one, deploy
  # and verify the backend separately before triggering the Netlify build.

  # Every key here is public by design, so finding its value in the repo or the
  # built main.dart.js is expected: browsers connect straight to CONVEX_URL,
  # Clerk publishable keys are client-side credentials, CONVEX_DEPLOYMENT is the
  # deployment name already visible inside CONVEX_URL, the Clerk issuer domain
  # is decodable from the publishable key, and the optional Stadia key is a
  # scoped client credential for preview/branch builds. Scoped to these keys on
  # purpose -- do NOT switch this to SECRETS_SCAN_OMIT_PATHS = "build/web/**",
  # which would stop scanning the entire published artifact and hide a real
  # leak (notably CLERK_SECRET_KEY, which the Clerk extension also injects).
  SECRETS_SCAN_OMIT_KEYS = "CONVEX_URL,CLERK_PUBLISHABLE_KEY,CONVEX_DEPLOYMENT,CLERK_JWT_ISSUER_DOMAIN,STADIA_MAPS_API_KEY"

[context.production.environment]
  EARPLUG_ENV = "prod"

[context.deploy-preview.environment]
  EARPLUG_ENV = "dev"

[context.branch-deploy.environment]
  EARPLUG_ENV = "dev"

# Flutter web uses path-based URLs, so a hard refresh on any route must still
# serve index.html instead of 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/flutter.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/AssetManifest.bin"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/AssetManifest.bin.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/FontManifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[images]
  remote_images = ["https://decisive-iguana-759\\.convex\\.cloud/api/storage/.*", "https://brilliant-cardinal-773\\.convex\\.cloud/api/storage/.*"]
