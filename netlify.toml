[build]
  publish = "build/web"
  # Netlify's build image has no Flutter SDK, so fetch it first. The version is
  # pinned to match local development; bump it deliberately rather than tracking
  # whatever "stable" happens to be on the day of a build.
  command = """
    if [ ! -d "$HOME/flutter" ]; then
      git clone https://github.com/flutter/flutter.git --depth 1 -b 3.44.6 "$HOME/flutter"
    fi
    export PATH="$HOME/flutter/bin:$PATH"
    flutter --version
    if [ "${EARPLUG_ENV:-dev}" = "prod" ]; then
      if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
        echo "CONVEX_DEPLOY_KEY is required for production releases"
        exit 1
      fi
      npx convex deploy --typecheck enable
      npm run check:release-contract -- prod
    fi
    flutter build web --release \
      --dart-define-from-file="config/${EARPLUG_ENV:-dev}.json"
  """

[build.environment]
  # Which config/*.json the web client reads — the Convex URL and Clerk key
  # travel together inside that file because they are chosen together, never
  # independently
  # (docs/environments.md). Preview and branch builds use development by
  # default; the production deploy context below overrides this value.
  EARPLUG_ENV = "dev"

  # Production-context builds also require a production Convex deploy key in
  # the Netlify UI. The build deploys and verifies the backend before Netlify
  # publishes a client that depends on its function contract.

  # Every key here is public by design, so finding its value in the repo or the
  # built main.dart.js is expected: browsers connect straight to CONVEX_URL,
  # Clerk publishable keys are client-side credentials, CONVEX_DEPLOYMENT is the
  # deployment name already visible inside CONVEX_URL, and the Clerk issuer
  # domain is decodable from the publishable key. Scoped to these keys on
  # purpose -- do NOT switch this to SECRETS_SCAN_OMIT_PATHS = "build/web/**",
  # which would stop scanning the entire published artifact and hide a real
  # leak (notably CLERK_SECRET_KEY, which the Clerk extension also injects).
  SECRETS_SCAN_OMIT_KEYS = "CONVEX_URL,CLERK_PUBLISHABLE_KEY,CONVEX_DEPLOYMENT,CLERK_JWT_ISSUER_DOMAIN"

[context.production.environment]
  EARPLUG_ENV = "prod"

[context.deploy-preview.environment]
  EARPLUG_ENV = "dev"

[context.branch-deploy.environment]
  EARPLUG_ENV = "dev"

# Flutter web uses path-based URLs, so a hard refresh on any route must still
# serve index.html instead of 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
